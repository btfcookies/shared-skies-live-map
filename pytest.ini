[pytest]
testpaths = tests
# Repo root on sys.path so tests import the backend the way uvicorn does
# (backend.main), from any working directory.
pythonpath = .
# No .pytest_cache in the repo (it is not gitignored).
addopts = -ra -p no:cacheprovider
filterwarnings =
    # Unpickling the bundle: XGBoost's "serialized model" notice and sklearn's
    # feature-name notice for LightGBM fed a plain ndarray. Both are expected.
    ignore:.*If you are loading a serialized model.*:UserWarning
    ignore:X does not have valid feature names:UserWarning
    # Starlette 1.x nudges TestClient users toward httpx2; httpx is what the
    # backend pins.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
